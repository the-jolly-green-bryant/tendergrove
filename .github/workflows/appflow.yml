name: Appflow Build & Deploy

# This workflow triggers builds and deployments on Ionic Appflow using the Appflow CLI.
#
# Prerequisite: Add a 'IONIC_TOKEN' secret to your GitHub repository settings.
# You can generate this token in the Appflow Dashboard (Personal Settings > Personal Access Tokens).

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Do not allow two main-branch releases to race each other into Google Play.
concurrency:
  group: appflow-android-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IONIC_TOKEN: ${{ secrets.IONIC_TOKEN }}
      APP_ID: '760262b0' # From appflow.config.json
      APPFLOW_VERSION: '1.3.0'
      SIGNING_CERT: production
      # Store destination names are case-sensitive and are configured in Appflow.
      DESTINATION: com.bryantjames.tendergrove
      # Google Play's alpha track is Closed testing.
      PLAY_TRACK: alpha

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Appflow CLI
        run: curl -fsSL https://ionic.io/get-appflow-cli | bash

      - name: Configure Google Play closed testing destination
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IONIC_TOKEN"

          appflow destination update-android \
            --app-id="$APP_ID" \
            --name="$DESTINATION" \
            --track="$PLAY_TRACK" \
            --json \
            --token="$IONIC_TOKEN" > appflow-destination-update.json

          appflow destination get \
            --app-id="$APP_ID" \
            --name="$DESTINATION" \
            --json \
            --token="$IONIC_TOKEN" | tee appflow-destination.json

          jq --arg track "${PLAY_TRACK^^}" -e '
            .target == "Google Play"
            and .artifactType == "AAB"
            and .track == $track
          ' appflow-destination.json > /dev/null || {
            echo "Appflow destination must use AAB and track ${PLAY_TRACK^^}." >&2
            exit 1
          }

      - name: Trigger Android Build
        id: android_build
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IONIC_TOKEN"

          appflow build android release \
            --app-id="$APP_ID" \
            --commit="$GITHUB_SHA" \
            --signing-cert="$SIGNING_CERT" \
            --json \
            --token="$IONIC_TOKEN" | tee appflow-build.json

          jq -e '
            .buildStatus == "SUCCESS"
            and .platform == "ANDROID"
            and (.buildId | type == "number")
          ' appflow-build.json > /dev/null

          echo "ANDROID_BUILD_ID=$(jq -r '.buildId' appflow-build.json)" >> "$GITHUB_OUTPUT"
          echo "ANDROID_BUILD_NUMBER=$(jq -r '.buildNumber' appflow-build.json)" >> "$GITHUB_OUTPUT"

#      - name: Trigger iOS Build
#        id: ios_build
#        run: |
#          IOS_BUILD_ID=$(appflow build ios app-store \
#            --app-id=$APP_ID \
#            --commit=$GITHUB_SHA \
#            --signing-cert="production" \
#            --json \
#            --token=$IONIC_TOKEN | jq -r ".buildId")
#          echo "IOS_BUILD_ID=$IOS_BUILD_ID" >> $GITHUB_OUTPUT

      - name: Deploy Android to Store
        shell: bash
        run: |
          set -euo pipefail

          appflow deploy android \
            --app-id="$APP_ID" \
            --build-id="${{ steps.android_build.outputs.ANDROID_BUILD_ID }}" \
            --destination="$DESTINATION" \
            --json \
            --token="$IONIC_TOKEN" | tee appflow-deployment.json

          jq --arg destination "$DESTINATION" -e '
            .buildStatus == "SUCCESS"
            and .platform == "ANDROID"
            and .destinationName == $destination
          ' appflow-deployment.json > /dev/null

      - name: Generate closed testing release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse HEAD^)"
          fi

          notes="$(git log --format='• %s' "$before..$GITHUB_SHA" | head -20)"
          if [[ -z "$notes" ]]; then
            notes="• Tendergrove closed testing update"
          fi

          {
            echo 'NOTES<<EOF'
            echo "$notes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish closed testing release
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: com.bryantjames.tendergrove
          PLAY_TRACK: alpha
          PLAY_RELEASE_NAME: Tendergrove ${{ steps.android_build.outputs.ANDROID_BUILD_NUMBER }}
          PLAY_RELEASE_NOTES: ${{ steps.release_notes.outputs.NOTES }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || {
            echo "Add the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON repository secret to publish drafts to testers." >&2
            exit 1
          }

          python -m pip install --disable-pip-version-check \
            google-auth==2.40.3 requests==2.32.4
          python scripts/publish-google-play-closed-test.py \
            | tee google-play-release.json

          jq -e '
            .track == "alpha"
            and .status == "completed"
            and (.versionCodes | length > 0)
          ' google-play-release.json > /dev/null

      - name: Publish release summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Android release deployed"
            echo "- Appflow build ID: ${{ steps.android_build.outputs.ANDROID_BUILD_ID }}"
            echo "- Android version code: ${{ steps.android_build.outputs.ANDROID_BUILD_NUMBER }}"
            echo "- Destination: $DESTINATION"
            echo "- Google Play track: Closed testing ($PLAY_TRACK)"
            echo "- Tester availability: Published"
            echo "- Release notes: commit summary"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
