name: Appflow Build & Deploy

# This workflow triggers builds and deployments on Ionic Appflow using the Appflow CLI.
#
# Prerequisite: Add a 'IONIC_TOKEN' secret to your GitHub repository settings.
# You can generate this token in the Appflow Dashboard (Personal Settings > Personal Access Tokens).

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Do not allow two main-branch mobile releases to race each other.
concurrency:
  group: appflow-mobile-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IONIC_TOKEN: ${{ secrets.IONIC_TOKEN }}
      APP_ID: '760262b0' # From appflow.config.json
      APPFLOW_VERSION: '1.3.0'
      SIGNING_CERT: production
      # Store destination names are case-sensitive and are configured in Appflow.
      DESTINATION: com.bryantjames.tendergrove
      # Google Play's alpha track is Closed testing.
      PLAY_TRACK: alpha

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Appflow CLI
        run: curl -fsSL https://ionic.io/get-appflow-cli | bash

      - name: Configure Google Play closed testing destination
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IONIC_TOKEN"

          appflow destination update-android \
            --app-id="$APP_ID" \
            --name="$DESTINATION" \
            --track="$PLAY_TRACK" \
            --json \
            --token="$IONIC_TOKEN" > appflow-destination-update.json

          appflow destination get \
            --app-id="$APP_ID" \
            --name="$DESTINATION" \
            --json \
            --token="$IONIC_TOKEN" | tee appflow-destination.json

          jq --arg track "${PLAY_TRACK^^}" -e '
            .target == "Google Play"
            and .artifactType == "AAB"
            and .track == $track
          ' appflow-destination.json > /dev/null || {
            echo "Appflow destination must use AAB and track ${PLAY_TRACK^^}." >&2
            exit 1
          }

      - name: Trigger Android Build
        id: android_build
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IONIC_TOKEN"

          appflow build android release \
            --app-id="$APP_ID" \
            --commit="$GITHUB_SHA" \
            --signing-cert="$SIGNING_CERT" \
            --json \
            --token="$IONIC_TOKEN" | tee appflow-build.json

          jq -e '
            .buildStatus == "SUCCESS"
            and .platform == "ANDROID"
            and (.buildId | type == "number")
          ' appflow-build.json > /dev/null

          echo "ANDROID_BUILD_ID=$(jq -r '.buildId' appflow-build.json)" >> "$GITHUB_OUTPUT"
          echo "ANDROID_BUILD_NUMBER=$(jq -r '.buildNumber' appflow-build.json)" >> "$GITHUB_OUTPUT"

#      - name: Trigger iOS Build
#        id: ios_build
#        run: |
#          IOS_BUILD_ID=$(appflow build ios app-store \
#            --app-id=$APP_ID \
#            --commit=$GITHUB_SHA \
#            --signing-cert="production" \
#            --json \
#            --token=$IONIC_TOKEN | jq -r ".buildId")
#          echo "IOS_BUILD_ID=$IOS_BUILD_ID" >> $GITHUB_OUTPUT

      - name: Deploy Android to Store
        shell: bash
        run: |
          set -euo pipefail

          appflow deploy android \
            --app-id="$APP_ID" \
            --build-id="${{ steps.android_build.outputs.ANDROID_BUILD_ID }}" \
            --destination="$DESTINATION" \
            --json \
            --token="$IONIC_TOKEN" | tee appflow-deployment.json

          jq --arg destination "$DESTINATION" -e '
            .buildStatus == "SUCCESS"
            and .platform == "ANDROID"
            and .destinationName == $destination
          ' appflow-deployment.json > /dev/null

      - name: Generate closed testing release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse HEAD^)"
          fi

          notes="$(git log --format='• %s' "$before..$GITHUB_SHA" | head -20)"
          if [[ -z "$notes" ]]; then
            notes="• Grove closed testing update"
          fi

          {
            echo 'NOTES<<EOF'
            echo "$notes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish closed testing release
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: com.bryantjames.tendergrove
          PLAY_TRACK: alpha
          PLAY_RELEASE_NAME: Grove ${{ steps.android_build.outputs.ANDROID_BUILD_NUMBER }}
          PLAY_RELEASE_NOTES: ${{ steps.release_notes.outputs.NOTES }}
          PLAY_LISTING_LANGUAGE: en-US
          PLAY_LISTING_TITLE: Grove
          PLAY_LISTING_SHORT_DESCRIPTION: See family wellbeing patterns. Turn quick check-ins into care-ready insights.
          PLAY_LISTING_FULL_DESCRIPTION: |-
            Care days blur together. Grove helps you remember what changed, notice what may be connected, and walk into care conversations with a clearer story.

            CHECK IN WITHOUT WRITING A JOURNAL

            Capture the day in a few taps. Choose the signals and events that matter to your family, add a note when you want to, and leave missing days unknown—not automatically “good” or “bad.”

            TURN DAILY MOMENTS INTO USEFUL PATTERNS

            See wellbeing over time instead of relying on the hardest or most recent day. Grove organizes recorded check-ins into approachable trends, calendars, and observations that help you notice:

            • Difficult stretches and positive changes
            • Shifts from a person’s usual range
            • Signals that often appear together
            • Events that may be worth discussing
            • Patterns shared across your household

            ARRIVE PREPARED

            Create an appointment-prep summary for a clinician, therapist, school, or care team. Bring the details that are easy to forget:

            • Recent wellbeing trends
            • Recorded signals and notes
            • Meaningful events and possible associations
            • Clear charts and observation calendars
            • A downloadable PDF with supporting evidence

            MADE FOR REAL FAMILY LIFE

            • Track yourself, a child, a partner, a parent, or another person you support
            • Personalize signals for each person
            • Record difficult and positive observations
            • Revisit past dates when you need to fill a gap
            • Keep sensitive family information organized in one place

            THOUGHTFUL, TRANSPARENT ANALYSIS

            Grove’s pattern concepts are informed by published research on repeated real-world observation and emotional dynamics. The app includes a Research & Methodology library explaining how its summaries work and where their limits are.

            Grove helps you organize observations; it does not diagnose, predict emergencies, determine care, or replace professional evaluation or treatment.
          PLAY_LISTING_ICON_PATH: pwa/store/google-play/icon-512.png
          PLAY_LISTING_FEATURE_GRAPHIC_PATH: pwa/store/google-play/feature-graphic.png
          PLAY_LISTING_PHONE_SCREENSHOT_PATHS: pwa/store/google-play/phone-screenshots/02-check-in.png,pwa/store/google-play/phone-screenshots/03-person-trend.png,pwa/store/google-play/phone-screenshots/04-appointment-prep.png,pwa/store/google-play/phone-screenshots/01-household-live.png
        run: |
          set -euo pipefail
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || {
            echo "Add the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON repository secret to publish drafts to testers." >&2
            exit 1
          }

          python -m pip install --disable-pip-version-check \
            google-auth==2.40.3 requests==2.32.4
          python scripts/publish-google-play-closed-test.py \
            | tee google-play-release.json

          jq -e '
            .track == "alpha"
            and .status == "completed"
            and .listingTitle == "Grove"
            and .listingIconUpdated == true
            and .listingFeatureGraphicUpdated == true
            and .listingPhoneScreenshotCount == 4
            and (.versionCodes | length > 0)
          ' google-play-release.json > /dev/null

      - name: Publish release summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Android release deployed"
            echo "- Appflow build ID: ${{ steps.android_build.outputs.ANDROID_BUILD_ID }}"
            echo "- Android version code: ${{ steps.android_build.outputs.ANDROID_BUILD_NUMBER }}"
            echo "- Destination: $DESTINATION"
            echo "- Google Play track: Closed testing ($PLAY_TRACK)"
            echo "- Google Play listing: Grove"
            echo "- Tester availability: Published"
            echo "- Release notes: commit summary"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-deploy-ios:
    # Keep Android releases green until the Appflow iOS certificate and
    # destination have been configured. The job automatically starts running
    # once both repository variables are present.
    if: ${{ vars.APPFLOW_IOS_SIGNING_CERT != '' && vars.APPFLOW_IOS_DESTINATION != '' }}
    runs-on: ubuntu-latest
    env:
      IONIC_TOKEN: ${{ secrets.IONIC_TOKEN }}
      APP_ID: '760262b0'
      # Configure these case-sensitive names in GitHub repository variables.
      SIGNING_CERT: ${{ vars.APPFLOW_IOS_SIGNING_CERT }}
      DESTINATION: ${{ vars.APPFLOW_IOS_DESTINATION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Appflow CLI
        run: curl -fsSL https://ionic.io/get-appflow-cli | bash

      - name: Validate iOS release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IONIC_TOKEN"
          test -n "$SIGNING_CERT" || {
            echo "Set the APPFLOW_IOS_SIGNING_CERT repository variable." >&2
            exit 1
          }
          test -n "$DESTINATION" || {
            echo "Set the APPFLOW_IOS_DESTINATION repository variable." >&2
            exit 1
          }

      - name: Verify Apple App Store destination
        shell: bash
        run: |
          set -euo pipefail
          appflow destination get \
            --app-id="$APP_ID" \
            --name="$DESTINATION" \
            --json \
            --token="$IONIC_TOKEN" | tee appflow-ios-destination.json

          jq -e '
            .target == "Apple App Store"
            and .artifactType == "IPA"
          ' appflow-ios-destination.json > /dev/null

      - name: Trigger iOS App Store build
        id: ios_build
        shell: bash
        run: |
          set -euo pipefail
          appflow build ios app-store \
            --app-id="$APP_ID" \
            --commit="$GITHUB_SHA" \
            --signing-cert="$SIGNING_CERT" \
            --json \
            --token="$IONIC_TOKEN" | tee appflow-ios-build.json

          jq -e '
            .buildStatus == "SUCCESS"
            and .platform == "IOS"
            and (.buildId | type == "number")
          ' appflow-ios-build.json > /dev/null

          echo "IOS_BUILD_ID=$(jq -r '.buildId' appflow-ios-build.json)" >> "$GITHUB_OUTPUT"
          echo "IOS_BUILD_NUMBER=$(jq -r '.buildNumber' appflow-ios-build.json)" >> "$GITHUB_OUTPUT"

      - name: Deploy iOS build to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          appflow deploy ios \
            --app-id="$APP_ID" \
            --build-id="${{ steps.ios_build.outputs.IOS_BUILD_ID }}" \
            --destination="$DESTINATION" \
            --json \
            --token="$IONIC_TOKEN" | tee appflow-ios-deployment.json

          jq --arg destination "$DESTINATION" -e '
            .buildStatus == "SUCCESS"
            and .platform == "IOS"
            and .destinationName == $destination
          ' appflow-ios-deployment.json > /dev/null

      - name: Publish iOS release summary
        if: success()
        shell: bash
        run: |
          {
            echo "### iOS release deployed"
            echo "- Appflow build ID: ${{ steps.ios_build.outputs.IOS_BUILD_ID }}"
            echo "- iOS build number: ${{ steps.ios_build.outputs.IOS_BUILD_NUMBER }}"
            echo "- Destination: $DESTINATION"
            echo "- Availability: Uploaded to App Store Connect / TestFlight"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
