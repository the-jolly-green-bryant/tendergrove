<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tendergrove – Design Overview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      padding: 40px;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #5C7A5E;
      margin-bottom: 8px;
    }
    .date {
      text-align: center;
      color: #888;
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      max-width: 1800px;
      margin: 0 auto;
    }
    .screen {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .screen img {
      width: 100%;
      display: block;
    }
    .screen .label {
      padding: 12px;
      text-align: center;
      font-weight: 600;
      color: #333;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <h1>🌿 Tendergrove – Current Design</h1>
  <p class="date">Generated: 2026-06-23</p>
  <div class="grid">
    <div class="screen">
      <img src="screenshots/01-login.png" alt="login">
      <div class="label">login</div>
    </div>
    <div class="screen">
      <img src="screenshots/02-household-dashboard.png" alt="household dashboard">
      <div class="label">household dashboard</div>
    </div>
    <div class="screen">
      <img src="screenshots/03-timeline.png" alt="timeline">
      <div class="label">timeline</div>
    </div>
    <div class="screen">
      <img src="screenshots/04-checkin-wizard.png" alt="checkin wizard">
      <div class="label">checkin wizard</div>
    </div>
    <div class="screen">
      <img src="screenshots/05-insights.png" alt="insights">
      <div class="label">insights</div>
    </div>
    <div class="screen">
      <img src="screenshots/06-reports-export.png" alt="reports export">
      <div class="label">reports export</div>
    </div>
    <div class="screen">
      <img src="screenshots/07-add-person.png" alt="add person">
      <div class="label">add person</div>
    </div>
    <div class="screen">
      <img src="screenshots/08-archived-people.png" alt="archived people">
      <div class="label">archived people</div>
    </div>
  </div>
</body>
</html>
