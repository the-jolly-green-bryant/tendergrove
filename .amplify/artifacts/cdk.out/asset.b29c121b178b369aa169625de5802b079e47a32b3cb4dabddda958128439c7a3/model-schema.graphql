type Household @model @auth(rules: [{allow: owner, ownerField: "owner"}])
{
  name: String!
  owner: String
  people: [Person] @hasMany(references: ["householdId"])
}

type Person @model @auth(rules: [{allow: owner, ownerField: "owner"}])
{
  householdId: ID!
  household: Household @belongsTo(references: ["householdId"])
  owner: String
  displayName: String!
  role: PersonRole
  avatarUrl: String
  indicators: [Indicator] @hasMany(references: ["personId"])
  checkIns: [CheckIn] @hasMany(references: ["personId"])
  events: [Event] @hasMany(references: ["personId"])
}

type Indicator @model @auth(rules: [{allow: owner, ownerField: "owner"}])
{
  personId: ID!
  person: Person @belongsTo(references: ["personId"])
  owner: String
  name: String!
  questionText: String
  polarity: IndicatorPolarity
  inputType: IndicatorInputType
  active: Boolean @default(value: "true")
}

type CheckIn @model @auth(rules: [{allow: owner, ownerField: "owner"}])
{
  personId: ID!
  person: Person @belongsTo(references: ["personId"])
  owner: String
  occurredAt: AWSDateTime!
  answersJson: AWSJSON
  note: String
}

type Event @model @auth(rules: [{allow: owner, ownerField: "owner"}])
{
  personId: ID!
  person: Person @belongsTo(references: ["personId"])
  owner: String
  occurredAt: AWSDateTime!
  type: EventType
  title: String!
  description: String
  metadataJson: AWSJSON
}

enum PersonRole {
  child
  parent
  spouse
  self
  caregiver
  other
}

enum IndicatorPolarity {
  desired
  undesired
}

enum IndicatorInputType {
  boolean
  scale
  count
  duration
  text
}

enum EventType {
  note
  incident
  school
  medical
  sleep
  medication
  other
  interaction
  event
}